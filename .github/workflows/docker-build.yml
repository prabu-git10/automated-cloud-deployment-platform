name: Docker Build and Push

on:
  push:
    branches:
      - main

  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: cloudops-app
  ECR_REGISTRY: 036215883813.dkr.ecr.ap-south-1.amazonaws.com

permissions:
  id-token: write
  contents: read

jobs:
  docker-build:
    name: Build, Scan and Push Docker Image
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. Checkout repository
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Configure AWS credentials using GitHub OIDC
      # --------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::036215883813:role/GitHubActions-ECR-CloudOps
          aws-region: ${{ env.AWS_REGION }}

      # --------------------------------------------------
      # 3. Verify AWS identity
      # --------------------------------------------------
      - name: Verify AWS identity
        run: |
          echo "Checking AWS identity..."
          aws sts get-caller-identity

      # --------------------------------------------------
      # 4. Generate unique immutable image tag
      # --------------------------------------------------
      - name: Generate image tag
        run: |
          IMAGE_TAG="${GITHUB_SHA}-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"

          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"

          echo "========================================"
          echo "Docker Image Tag"
          echo "========================================"
          echo "$IMAGE_TAG"

      # --------------------------------------------------
      # 5. Login to Amazon ECR
      # --------------------------------------------------
      - name: Login to Amazon ECR
        run: |
          echo "Logging in to Amazon ECR..."

          aws ecr get-login-password \
            --region "$AWS_REGION" \
            | docker login \
            --username AWS \
            --password-stdin "$ECR_REGISTRY"

      # --------------------------------------------------
      # 6. Build Docker image from backend folder
      # --------------------------------------------------
      - name: Build Docker image
        run: |
          echo "========================================"
          echo "Building Docker Image"
          echo "========================================"

          docker build \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            ./backend

      # --------------------------------------------------
      # 7. Run Trivy vulnerability scan
      # --------------------------------------------------
      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      # --------------------------------------------------
      # 8. Push Docker image to ECR
      # --------------------------------------------------
      - name: Push Docker image to ECR
        run: |
          echo "========================================"
          echo "Pushing Docker Image to Amazon ECR"
          echo "========================================"

          docker push \
            "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      # --------------------------------------------------
      # 9. Verify image in ECR
      # --------------------------------------------------
      - name: Verify image in ECR
        run: |
          echo "========================================"
          echo "Verifying ECR Image"
          echo "========================================"

          aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$IMAGE_TAG" \
            --region "$AWS_REGION"

      # --------------------------------------------------
      # 10. Display final image information
      # --------------------------------------------------
      - name: Display image information
        run: |
          echo "========================================"
          echo "BUILD SUCCESSFUL"
          echo "========================================"

          echo "Repository:"
          echo "$ECR_REGISTRY/$ECR_REPOSITORY"

          echo "Image Tag:"
          echo "$IMAGE_TAG"

          echo "Full Image:"
          echo "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          echo "========================================"