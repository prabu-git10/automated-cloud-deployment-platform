name: Docker Build and Push

on:
  push:
    branches:
      - main

  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: 036215883813.dkr.ecr.ap-south-1.amazonaws.com
  BACKEND_REPOSITORY: cloudops-app
  FRONTEND_REPOSITORY: cloudops-frontend

permissions:
  id-token: write
  contents: read

jobs:
  docker-build:
    name: Build, Scan and Push Application Images
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. Checkout repository
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Configure AWS credentials using GitHub OIDC
      # --------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::036215883813:role/GitHubActions-ECR-CloudOps
          aws-region: ${{ env.AWS_REGION }}

      # --------------------------------------------------
      # 3. Verify AWS identity
      # --------------------------------------------------
      - name: Verify AWS identity
        run: |
          echo "========================================"
          echo "AWS Identity"
          echo "========================================"

          aws sts get-caller-identity

      # --------------------------------------------------
      # 4. Generate unique immutable image tag
      # --------------------------------------------------
      - name: Generate image tag
        run: |
          IMAGE_TAG="${GITHUB_SHA}-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"

          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"

          echo "========================================"
          echo "IMAGE TAG"
          echo "========================================"

          echo "$IMAGE_TAG"

      # --------------------------------------------------
      # 5. Login to Amazon ECR
      # --------------------------------------------------
      - name: Login to Amazon ECR
        run: |
          echo "========================================"
          echo "Logging in to Amazon ECR"
          echo "========================================"

          aws ecr get-login-password \
            --region "$AWS_REGION" \
            | docker login \
            --username AWS \
            --password-stdin "$ECR_REGISTRY"

      # --------------------------------------------------
      # 6. Build backend image
      # --------------------------------------------------
      - name: Build backend Docker image
        run: |
          echo "========================================"
          echo "BUILDING BACKEND IMAGE"
          echo "========================================"

          docker build \
            -t "$ECR_REGISTRY/$BACKEND_REPOSITORY:$IMAGE_TAG" \
            ./app/backend

      # --------------------------------------------------
      # 7. Scan backend image
      # --------------------------------------------------
      - name: Scan backend image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.ECR_REGISTRY }}/${{ env.BACKEND_REPOSITORY }}:${{ env.IMAGE_TAG }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      # --------------------------------------------------
      # 8. Push backend image
      # --------------------------------------------------
      - name: Push backend image
        run: |
          echo "========================================"
          echo "PUSHING BACKEND IMAGE"
          echo "========================================"

          docker push \
            "$ECR_REGISTRY/$BACKEND_REPOSITORY:$IMAGE_TAG"

      # --------------------------------------------------
      # 9. Verify backend image
      # --------------------------------------------------
      - name: Verify backend image
        run: |
          aws ecr describe-images \
            --repository-name "$BACKEND_REPOSITORY" \
            --image-ids imageTag="$IMAGE_TAG" \
            --region "$AWS_REGION"

      # --------------------------------------------------
      # 10. Build frontend image
      # --------------------------------------------------
      - name: Build frontend Docker image
        run: |
          echo "========================================"
          echo "BUILDING FRONTEND IMAGE"
          echo "========================================"

          docker build \
            -t "$ECR_REGISTRY/$FRONTEND_REPOSITORY:$IMAGE_TAG" \
            ./app/frontend

      # --------------------------------------------------
      # 11. Scan frontend image
      # --------------------------------------------------
      - name: Scan frontend image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.ECR_REGISTRY }}/${{ env.FRONTEND_REPOSITORY }}:${{ env.IMAGE_TAG }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      # --------------------------------------------------
      # 12. Push frontend image
      # --------------------------------------------------
      - name: Push frontend image
        run: |
          echo "========================================"
          echo "PUSHING FRONTEND IMAGE"
          echo "========================================"

          docker push \
            "$ECR_REGISTRY/$FRONTEND_REPOSITORY:$IMAGE_TAG"

      # --------------------------------------------------
      # 13. Verify frontend image
      # --------------------------------------------------
      - name: Verify frontend image
        run: |
          aws ecr describe-images \
            --repository-name "$FRONTEND_REPOSITORY" \
            --image-ids imageTag="$IMAGE_TAG" \
            --region "$AWS_REGION"

      # --------------------------------------------------
      # 14. Create deployment metadata
      # --------------------------------------------------
      - name: Create deployment metadata
        run: |
          echo "IMAGE_TAG=$IMAGE_TAG" > deployment.env

          echo "BACKEND_IMAGE=$ECR_REGISTRY/$BACKEND_REPOSITORY:$IMAGE_TAG" >> deployment.env

          echo "FRONTEND_IMAGE=$ECR_REGISTRY/$FRONTEND_REPOSITORY:$IMAGE_TAG" >> deployment.env

          echo "========================================"
          echo "DEPLOYMENT METADATA"
          echo "========================================"

          cat deployment.env

      # --------------------------------------------------
      # 15. Upload deployment metadata
      # --------------------------------------------------
      - name: Upload deployment metadata
        uses: actions/upload-artifact@v4
        with:
          name: deployment-metadata
          path: deployment.env

      # --------------------------------------------------
      # 16. Final result
      # --------------------------------------------------
      - name: Display final image information
        run: |
          echo "========================================"
          echo "BUILD SUCCESSFUL"
          echo "========================================"

          echo "Backend:"
          echo "$ECR_REGISTRY/$BACKEND_REPOSITORY:$IMAGE_TAG"

          echo "Frontend:"
          echo "$ECR_REGISTRY/$FRONTEND_REPOSITORY:$IMAGE_TAG"

          echo "========================================"